name: tram_flutter
description: "TramApp - Hệ thống quản lý nhà hàng"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  cloud_functions: ^5.1.3

  # State Management (simple, no code gen needed)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.3.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Charts
  fl_chart: ^0.68.0

  # QR Code
  qr_flutter: ^4.1.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  http: ^1.2.2
  path_provider: ^2.1.4
  excel: ^4.0.6
  share_plus: ^10.0.2
  file_picker: ^11.0.3
  print_bluetooth_thermal: ^1.1.7
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
